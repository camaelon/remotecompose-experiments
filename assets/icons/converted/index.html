<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Symbols in RemoteCompose</title>
<!-- generated by avd/convert_icons.py from avd/icons_gallery.html -->
<style>
  :root {
    --bg: #F5F7FA; --tile: #FFFFFF; --tile-hover: #EEF2F8; --line: #DCE1E8; --text: #111827; --muted: #5A6475;
    --accent: #1565D8; --on-accent: #FFFFFF; --field: #FFFFFF; --shade: rgba(16, 24, 40, 0.35);
  }
  :root[data-theme="dark"] {
    --bg: #101828; --tile: #1C2433; --tile-hover: #263042; --line: #2A3342; --text: #E6EAF2; --muted: #8A94A6;
    --accent: #4DA3FF; --on-accent: #0B1220; --field: #141C2B; --shade: rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
  input, select, button { font: inherit; color: var(--text); }
  input[type=search] { flex: 1 1 220px; min-width: 0; max-width: 420px; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  select { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--field); border: 0; padding: 5px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .btn { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 8px; min-width: 0;
          background: var(--tile); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--text); }
  .tile:hover, .tile:focus-visible { background: var(--tile-hover); outline: none; border-color: var(--accent); }
  .tile canvas { width: 36px; height: 36px; display: block; }
  .tile .n { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.none canvas { opacity: 0; }
  .tile.none .n { opacity: 0.5; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #pool { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px; overflow: hidden; }
  /* detail */
  #shade { position: fixed; inset: 0; background: var(--shade); z-index: 3; }
  #detail { position: fixed; z-index: 4; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px));
            max-height: calc(100vh - 32px); overflow: auto; background: var(--tile); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  #detail .top { display: flex; gap: 16px; align-items: flex-start; }
  #big { width: 96px; height: 96px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 12px; }
  #big canvas { display: block; }
  #detail h2 { font-size: 17px; margin: 0 0 4px; overflow-wrap: anywhere; }
  #detail .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  #detail .tags { margin: 14px 0; display: flex; flex-wrap: wrap; gap: 4px; }
  #detail .tags span { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  #detail pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #detail .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  #detail .close { margin-left: auto; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); } .count { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Material Symbols</h1>
    <input type="search" id="q" placeholder="Search names, tags, categories" aria-label="Search icons" autocomplete="off">
    <select id="cat" aria-label="Category"><option value="-1">All categories</option></select>
    <div class="seg" id="style" role="group" aria-label="Style"></div>
    <button class="btn" id="filled" aria-pressed="false">Filled</button>
    <select id="sort" aria-label="Sort"><option value="pop">Popular first</option><option value="name">A–Z</option></select>
    <button class="btn" id="theme">Dark</button>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">No icon matches.</div>
</main>
<div id="pool" aria-hidden="true"></div>
<div id="shade" class="hidden"></div>
<div id="detail" class="hidden" role="dialog" aria-modal="true" aria-labelledby="dname">
  <div class="top">
    <div id="big"></div>
    <div style="min-width:0">
      <h2 id="dname"></h2>
      <div class="meta" id="dmeta"></div>
    </div>
  </div>
  <div class="tags" id="dtags"></div>
  <pre id="snippet"></pre>
  <div class="row">
    <button class="btn" id="copy">Copy</button>
    <span class="meta" id="dfile"></span>
    <button class="btn close" id="dclose">Close</button>
  </div>
</div>
<script src="gallery/player.min.js"></script>
<script src="gallery/index.js"></script>
<script>
(function () {
  "use strict";
  var IX = window.ICONS_INDEX, STYLES = IX.styles, CATS = IX.categories, CHUNK = IX.chunk;
  var ICON = 36, DPR = Math.min(3, window.devicePixelRatio || 1), PX = Math.round(ICON * DPR), POOL = 8;
  var state = { q: "", cat: -1, style: "outlined", filled: false, sort: "pop", theme: "light" };
  try { var saved = JSON.parse(localStorage.getItem("rc-icons-gallery") || "{}"); for (var k in saved) if (k in state) state[k] = saved[k]; } catch (e) {}
  function save() { try { localStorage.setItem("rc-icons-gallery", JSON.stringify({ style: state.style, filled: state.filled, sort: state.sort, theme: state.theme })); } catch (e) {} }

  // ---- data chunks: gallery/<variant>/<n>.js call ICONS_CHUNK(variant, n, [base64 .rc ...])
  var chunks = {}, waiting = {};
  window.ICONS_CHUNK = function (vk, n, arr) {
    var key = vk + "/" + n;
    chunks[key] = arr;
    (waiting[key] || []).forEach(function (f) { f(arr); });
    delete waiting[key];
  };
  function withChunk(vk, n, cb) {
    var key = vk + "/" + n;
    if (chunks[key]) return cb(chunks[key]);
    if (waiting[key]) { waiting[key].push(cb); return; }
    waiting[key] = [cb];
    var s = document.createElement("script");
    s.src = "gallery/" + vk + "/" + n + ".js";
    s.onerror = function () { delete waiting[key]; };
    document.head.appendChild(s);
  }
  function variant() { return state.style + (state.filled ? "-filled" : ""); }
  function bit(style, filled) { return 1 << (STYLES.indexOf(style) * 2 + (filled ? 1 : 0)); }
  function rcFor(i, vk, cb) { withChunk(vk, Math.floor(i / CHUNK), function (arr) { cb(arr[i % CHUNK] || null); }); }

  // ---- rendering: a pool of offscreen players draws each visible icon once into its tile
  var pool = [], queue = [], poolHost = document.getElementById("pool");
  for (var p = 0; p < POOL; p++) {
    var h = RC.createPlayer(poolHost, { theme: state.theme });
    h.player.setDensity(DPR);
    h.resize(PX, PX);
    pool.push({ h: h, busy: false });
  }
  function pump() {
    pool.forEach(function (slot) {
      if (slot.busy) return;
      var t;
      while ((t = queue.shift()) && (!t.visible || t.want === t.drawn || t.pending)) {}
      if (!t) return;
      slot.busy = true;
      t.pending = true;
      var want = t.want, vk = want.split("|")[0];
      rcFor(t.i, vk, function (b64) {
        function done() { t.pending = false; slot.busy = false; pump(); }
        if (!b64) { done(); return; }
        slot.h.loadFromBase64(b64).then(function () {
          var ctx = t.canvas.getContext("2d");
          ctx.clearRect(0, 0, PX, PX);
          ctx.drawImage(slot.h.canvas, 0, 0);
          slot.h.player.stop();
          t.drawn = want;
          if (t.want !== want && t.visible) queue.push(t);
          done();
        }, done);
      });
    });
  }
  function request(t) {
    if (!(ICONS[t.i][4] & bit(state.style, state.filled))) { t.el.classList.add("none"); return; }
    t.el.classList.remove("none");
    t.want = variant() + "|" + state.theme;
    if (t.drawn !== t.want && !t.pending) { queue.push(t); pump(); }
  }

  // ---- tiles
  var ICONS = IX.icons, grid = document.getElementById("grid"), tiles = [];
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var t = tiles[+en.target.dataset.i];
      t.visible = en.isIntersecting;
      if (t.visible) request(t);
    });
  }, { rootMargin: "300px 0px" });
  ICONS.forEach(function (ic, i) {
    var el = document.createElement("button");
    el.className = "tile";
    el.dataset.i = i;
    el.title = ic[0];
    var c = document.createElement("canvas");
    c.width = c.height = PX;
    var n = document.createElement("span");
    n.className = "n";
    n.textContent = ic[0];
    el.appendChild(c); el.appendChild(n);
    el.addEventListener("click", function () { openDetail(i); });
    var t = { i: i, el: el, canvas: c, visible: false, want: null, drawn: null, pending: false,
              hay: (ic[0] + " " + ic[0].replace(/_/g, " ") + " " + ic[2].replace(/\|/g, " ") + " " + ic[1].map(function (k) { return CATS[k]; }).join(" ")).toLowerCase() };
    tiles.push(t);
  });

  function order() {
    var idx = tiles.map(function (t) { return t.i; });
    if (state.sort === "pop") idx.sort(function (a, b) { return ICONS[b][3] - ICONS[a][3] || (ICONS[a][0] < ICONS[b][0] ? -1 : 1); });
    var frag = document.createDocumentFragment();
    idx.forEach(function (i) { frag.appendChild(tiles[i].el); });
    grid.appendChild(frag);
  }
  function filter() {
    var words = state.q.toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
    tiles.forEach(function (t) {
      var ic = ICONS[t.i], ok = (state.cat < 0 || ic[1].indexOf(state.cat) >= 0) && (ic[4] & bit(state.style, state.filled)) !== 0;
      for (var w = 0; ok && w < words.length; w++) ok = t.hay.indexOf(words[w]) >= 0;
      t.el.classList.toggle("hidden", !ok);
      if (ok) shown++;
    });
    document.getElementById("count").textContent = shown.toLocaleString() + " of " + ICONS.length.toLocaleString() + " icons";
    document.getElementById("empty").classList.toggle("hidden", shown > 0);
  }
  function refresh() {
    queue = [];
    tiles.forEach(function (t) { if (t.visible) request(t); });
  }

  // ---- controls
  var catSel = document.getElementById("cat");
  CATS.forEach(function (c, k) { var o = document.createElement("option"); o.value = k; o.textContent = c; catSel.appendChild(o); });
  var seg = document.getElementById("style");
  STYLES.forEach(function (s) {
    var b = document.createElement("button");
    b.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    b.dataset.s = s;
    b.addEventListener("click", function () { state.style = s; syncControls(); save(); filter(); refresh(); });
    seg.appendChild(b);
  });
  function syncControls() {
    Array.prototype.forEach.call(seg.children, function (b) { b.setAttribute("aria-pressed", b.dataset.s === state.style ? "true" : "false"); });
    document.getElementById("filled").setAttribute("aria-pressed", state.filled ? "true" : "false");
    document.getElementById("sort").value = state.sort;
    document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("theme").textContent = state.theme === "dark" ? "Light" : "Dark";
  }
  var timer = 0;
  document.getElementById("q").addEventListener("input", function (e) {
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = e.target.value; filter(); }, 80);
  });
  catSel.addEventListener("change", function () { state.cat = +catSel.value; filter(); });
  document.getElementById("filled").addEventListener("click", function () { state.filled = !state.filled; syncControls(); save(); filter(); refresh(); });
  document.getElementById("sort").addEventListener("change", function (e) { state.sort = e.target.value; save(); order(); });
  document.getElementById("theme").addEventListener("click", function () {
    state.theme = state.theme === "dark" ? "light" : "dark";
    pool.forEach(function (s) { s.h.player.setTheme(state.theme); });
    if (big) big.player.setTheme(state.theme);
    syncControls(); save(); refresh();
  });

  // ---- detail
  var big = null, detailIdx = -1;
  function snippet(name) {
    return '{"Icon": {"name": ' + JSON.stringify(name) + ', "style": "' + state.style + '", "filled": ' + state.filled + '}}';
  }
  function openDetail(i) {
    var ic = ICONS[i], vk = variant();
    detailIdx = i;
    document.getElementById("dname").textContent = ic[0];
    var have = [];
    STYLES.forEach(function (s) { [false, true].forEach(function (f) { if (ic[4] & bit(s, f)) have.push(s + (f ? " filled" : "")); }); });
    document.getElementById("dmeta").textContent = (ic[1].length ? ic[1].map(function (k) { return CATS[k]; }).join(", ") : "No category") +
      " · popularity " + ic[3].toLocaleString() + " · " + have.join(", ");
    var tags = document.getElementById("dtags");
    tags.textContent = "";
    (ic[2] ? ic[2].split("|") : []).forEach(function (tg) {
      var s = document.createElement("span"); s.textContent = tg; tags.appendChild(s);
    });
    document.getElementById("snippet").textContent = snippet(ic[0]);
    var stem = ic[0] + "/materialsymbols" + state.style + "/" + ic[0] + (state.filled ? "_fill1" : "") + "_24px";
    document.getElementById("dfile").textContent = "material-symbols/" + stem + ".json";
    document.getElementById("copy").textContent = "Copy";
    document.getElementById("shade").classList.remove("hidden");
    document.getElementById("detail").classList.remove("hidden");
    var host = document.getElementById("big");
    if (big) { big.destroy(); big = null; }
    host.textContent = "";
    if (!(ic[4] & bit(state.style, state.filled))) { host.textContent = "—"; return; }
    rcFor(i, vk, function (b64) {
      if (detailIdx !== i || !b64) return;
      big = RC.createPlayer(host, { theme: state.theme });
      big.player.setDensity(DPR);
      big.resize(Math.round(72 * DPR), Math.round(72 * DPR));
      big.loadFromBase64(b64);
    });
    document.getElementById("dclose").focus();
  }
  function closeDetail() {
    detailIdx = -1;
    if (big) { big.destroy(); big = null; }
    document.getElementById("shade").classList.add("hidden");
    document.getElementById("detail").classList.add("hidden");
  }
  document.getElementById("dclose").addEventListener("click", closeDetail);
  document.getElementById("shade").addEventListener("click", closeDetail);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });
  document.getElementById("copy").addEventListener("click", function () {
    var text = document.getElementById("snippet").textContent, b = this;
    function ok() { b.textContent = "Copied"; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (e) {}
      ta.remove();
    }
  });

  syncControls();
  order();
  filter();
  tiles.forEach(function (t) { io.observe(t.el); });
})();
</script>
</body>
</html>
